# GoReleaser config. Cross-compiles cfdns-cli and publishes a GitHub release.
# Run locally with: goreleaser release --snapshot --clean
version: 2

project_name: cfdns-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: cfdns
    binary: cfdns
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    # Match the naming the homebrew-tools tap updater expects, e.g.
    # cfdns-cli_Darwin_arm64.tar.gz / cfdns-cli_Linux_x86_64.tar.gz.
    name_template: '{{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: DigitalTolk
    name: cfdns-cli
